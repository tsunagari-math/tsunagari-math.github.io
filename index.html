<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>つながりMathガイド</title>
<style>
  /* 合言葉の入力画面（公開用のURL版だけに付きます） */
  :root { --ink: #3b3a52; --soft: #77768f; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 16px;
    display: grid; place-items: center;
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Meiryo", sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, #fff4d9 0%, #ffe3ec 45%, #dff1ff 100%) fixed;
  }
  .box { background: #fff; border-radius: 26px; padding: 26px 22px; width: 100%; max-width: 380px; box-shadow: 0 14px 28px rgba(80,70,140,.18); }
  h1 { font-size: 1.3rem; margin: 0 0 14px; text-align: center; }
  label.t { display: block; font-weight: 700; margin-bottom: 6px; }
  input[type=text] { width: 100%; padding: 12px 14px; border-radius: 14px; border: 3px solid #ddd8ee; background: #fbfaff; font: inherit; font-size: 1.1rem; }
  input[type=text]:focus { outline: none; border-color: #6fb7ff; }
  .keep { display: flex; align-items: center; gap: 8px; margin: 12px 0 4px; font-size: .9rem; }
  .keep input { width: 20px; height: 20px; }
  .err { color: #d6336c; font-weight: 700; min-height: 1.5em; margin: 6px 0; font-size: .9rem; }
  button { width: 100%; border: none; border-radius: 99px; padding: 13px; font: inherit; font-weight: 700; font-size: 1.05rem; color: #fff; background: linear-gradient(180deg, #6fb7ff, #2f8fe8); cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .note { font-size: .8rem; color: var(--soft); margin: 14px 0 0; text-align: center; }
</style>
</head>
<body>
<form class="box" id="lockForm">
  <h1>🧭 つながりMathガイド</h1>
  <label class="t" for="pw">合言葉を入力してください</label>
  <!-- 合言葉は秘密というより「使う人の目印」なので、打った文字がそのまま見える入力欄にしている -->
  <input type="text" id="pw" autocomplete="off" autocapitalize="off" spellcheck="false" required>
  <label class="keep"><input type="checkbox" id="keep" checked> この端末で覚えておく</label>
  <div class="err" id="err" role="alert"></div>
  <button id="go">ひらく</button>
  <p class="note">合言葉は、このアプリを紹介してくれた人に聞いてください。</p>
</form>

  var SAVE_KEY = "tsunagariMath.pass";

  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }

  async function unlock(pass) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" },
      base, { name: "AES-CBC", length: 256 }, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({ name: "AES-CBC", iv: b64(IV) }, key, b64(DATA));
    var html = new TextDecoder().decode(plain).replace(/^﻿/, "");
    if (html.indexOf("<!DOCTYPE html>") !== 0) throw new Error("合言葉がちがいます");
    return html;
  }

  function show(html) { document.open(); document.write(html); document.close(); }
  function load() { try { return localStorage.getItem(SAVE_KEY); } catch (e) { return null; } }
  function save(p) { try { localStorage.setItem(SAVE_KEY, p); } catch (e) {} }
  function forget() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

  var form = document.getElementById("lockForm");
  var err = document.getElementById("err");
  var btn = document.getElementById("go");

  if (!window.crypto || !crypto.subtle) {
    err.textContent = "このブラウザでは開けません。ほかのブラウザで試してください。";
    btn.disabled = true;
    return;
  }

  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    var pass = document.getElementById("pw").value.trim();
    if (!pass) return;
    btn.disabled = true; err.textContent = "";
    try {
      var html = await unlock(pass);
      if (document.getElementById("keep").checked) save(pass); else forget();
      show(html);
    } catch (e) {
      err.textContent = "合言葉がちがいます";
      btn.disabled = false;
    }
  });

  // 前に「覚えておく」にした端末では、入力なしで開く
  var saved = load();
  if (saved) {
    unlock(saved).then(show).catch(function () { forget(); });
  }
